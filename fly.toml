# fly.toml app configuration file generated for ex-rag-time on 2024-11-10T08:34:15+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ex-rag-time'
primary_region = 'ord'
kill_signal = 'SIGTERM'

[build]

[env]
  DATABASE_PATH = '/mnt/name/name.db'
  PHX_HOST = 'ex-rag-time.fly.dev'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/mnt/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  size = 'l40s'
